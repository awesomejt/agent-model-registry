[project]
name = "model-registry"
version = "0.1.0"
description = "Registry of local LLM models, weights artifacts and deployments with derived unique keys"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
registry = "model_registry.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
